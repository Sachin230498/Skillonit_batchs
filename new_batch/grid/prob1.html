<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
         height: 600px;
         border: 2px solid red;
         font-size: 30px;
         display: grid;
        grid-template-columns: 100px 200px;
        grid-template-rows: 100px 50px 300px;
        gap: 10px 20px;
        }

        .innner{
            border: 2px solid green;
            
        }
    </style>
</head>
<body>
    <div id="main">
        <div class="innner">box-1</div>
        <div class="innner">box-2</div>
        <div class="innner">box-3</div>
        <div class="innner">box-4</div>
        <div class="innner">box-5</div>
    </div>
</body>
</html>

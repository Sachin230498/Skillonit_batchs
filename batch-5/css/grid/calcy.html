<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #calcy{
            width: 380px;
            /* border: 4px solid; */
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
            margin: auto;
            margin-top: 100px;
            padding: 30px 20px;
        }
        #display{
            width: 90%;
            /* border: 2px solid red; */
            height: 70px;
            margin: auto;
            border-radius: 15px;
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
        }
        #keyboard{
            width: 90%;
            /* border: 2px solid rgb(55, 0, 255); */
            height: 350px;
            font-size: 25px;
            font-weight: bold;
            margin: auto;
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 10px;
        }

        #keyboard>div{
            /* border: 2px solid; */
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bl{
            background-color: black;
            color: white;
        }

        .red{
            background-color: orangered;
            color: white;
        }
    </style>
</head>
<body>
    <div id="calcy">
        <div id="display"></div>
        <div id="keyboard">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div class="bl">+</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div class="bl">-</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div class="bl">x</div>
            <div class="red">C</div>
            <div >0</div>
            <div class="bl">=</div>
            <div class="bl">/</div>
        </div>
    </div>
</body>
</html>

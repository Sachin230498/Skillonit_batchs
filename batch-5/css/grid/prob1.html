<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
      #container {
        height: 600px;
        border: 5px solid;
       font-size: 30px;
       display: grid;
       grid-template-columns: 200px 250px 300px 100px;
       grid-template-rows: 100px 250px;
      }
       #container>div{  
        border: 5px solid red;
       }
    </style>
  </head>
  <body>
    <div id="container">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
     
    </div>
    </body>
</html>

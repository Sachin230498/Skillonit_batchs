<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            height: 600px;
            border: 5px solid;
            display: grid;
            font-size: 30px;
            grid-template-columns: 200px 200px 200px 200px;
            gap: 10px 20px;
        }

        #main>div{
            border: 4px solid red;
        }
    </style>
</head>
<body>
   <div id="main">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>

   </div> 
</body>
</html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #navbar{
            background-color: yellow;
            padding: 2px 10px;
        }

        #main{
           height: 500px;
           /* border: 2px solid; */
           margin-top: 20px;
           display: flex;
           justify-content: space-between;
        }

        #red{
            width: 65%;
            height: 100%;
            background-color: red;
        }

        #grn{
            width: 30%;
            height: 100%;
            /* border: 5px solid green; */
            display: grid;
            grid-template-columns: repeat(1,1fr);
            gap: 15px;
            font-size: 30px;
            font-weight: bold;
        }

        #grn>div{
            /* border: 2px solid; */
            background-color: greenyellow;
        }


        /* medium screen */
        @media all and (min-width:480px) and (max-width:768px){
           #main{
            display: block;
           }

           #red{
            width: 100%;
           }

           #grn{
            width: 100%;
            height: 200px;
            grid-template-columns: repeat(3,1fr);
            margin-top: 20px;
           }
        }

        
        /* small screen */
        @media all and (min-width:320px) and (max-width:480px){
           #main{
            display: block;
           }

           #red{
            width: 100%;
           }

           #grn{
            width: 100%;
            grid-template-columns: repeat(1,1fr);
            margin-top: 20px;
           }
        }
    </style>
</head>
<body>
   <div id="navbar">
    <h1>Navigation</h1>
   </div>
   
   <div id="main">
    <div id="red"></div>
    <div id="grn">
        <div>box-1</div>
        <div>box-2</div>
        <div>box-3</div>
    </div>
   </div>
</body>
</html>

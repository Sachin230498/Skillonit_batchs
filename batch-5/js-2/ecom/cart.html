<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        #navbtn{
          
            display: grid;
            grid-template-columns: repeat(3,1fr);
            align-items: center;
            gap: 20px;

        }


.cartdiv{
    display: flex;
    gap: 20px;
    align-items: center;
}


      
    </style>
</head>
<body>
      <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">MyLogo</div>
        <a class="logo" href="./index.html">Home</a>
        <div id="navbtn" class="nav-buttons">
            <a href="/login.html" class="btn login-btn">Login</a>
            <a href="/signup.html" class="btn signup-btn">Signup</a>
        </div>
    </nav>



 <div id="main"></div>
</body>
<script>

let username = localStorage.getItem("loginData")
let navbuttons = document.getElementById("navbtn")
let cartArr = JSON.parse(localStorage.getItem("cartData"))

cartArr.map(function(el){
    if(!el.currentQuntity){
        el.currentQuntity = 1
    }
})


console.log(cartArr)
display(cartArr)

// console.log(!username)

if(username!=null){
  navbuttons.innerHTML = "";

  let user = document.createElement("h2")
  user.innerText = username;


  let logoutbtn = document.createElement("button")
  logoutbtn.innerText = "Logout"
  logoutbtn.addEventListener("click", function(){
    localStorage.removeItem("loginData")
    window.location.href = "login.html"
  })

  user.style.color = "white"
   navbuttons.append(user,logoutbtn)

}

function display(data){
data.map(function(el,index){
    // console.log(el)

    let title = document.createElement("h1")
    title.innerText = el.title;
    let price = document.createElement("h2")
    price.innerText = Math.floor(el.price);
    let image = document.createElement("img")
    image.src = el.image

    let cdiv = document.createElement("div")
    cdiv.setAttribute("class","cartdiv")


    let plusbtn = document.createElement("button")
    plusbtn.innerText = "+"
    let minusbtn = document.createElement("button")
    minusbtn.innerText = "-"
    let quntity = document.createElement("h2")
    quntity.innerText = el.currentQuntity
    
    cdiv.append(minusbtn,quntity,plusbtn)

    let div = document.createElement("div")
    div.append(image,title,price,cdiv )
    main.append(div)

})
}



// let a = 10.55;

// console.log( Math.floor(a) )


// let obj = {}
// obj.name = 11
// console.log(obj)


</script>
</html>

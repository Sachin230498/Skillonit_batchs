<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
   
</head>
<body>
      <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">MyLogo</div>
        <a class="logo" href="./index.html">Home</a>
        <div id="navbtn" class="nav-buttons">
            <a href="/login.html" class="btn login-btn">Login</a>
            <a href="/signup.html" class="btn signup-btn">Signup</a>
        </div>
    </nav>


<div id="main"></div>
</body>

<script>
let username = localStorage.getItem("loginData")
let navbuttons = document.getElementById("navbtn")
let main = document.getElementById("main")
let lsdata = JSON.parse( localStorage.getItem("data"))
let cartArr = JSON.parse(localStorage.getItem("cartArr")) || [];
// console.log(lsdata)
display(lsdata)

if(username!=null){
  navbuttons.innerHTML = "";

  let user = document.createElement("h2")
  user.innerText = username;

  let cartbtn = document.createElement("button")
  cartbtn.addEventListener("click",function(){
     window.location.href = "cart.html"
  })
  cartbtn.innerText = "Cart"

  let logoutbtn = document.createElement("button")
  logoutbtn.innerText = "Logout"
  logoutbtn.addEventListener("click", function(){
    localStorage.removeItem("loginData")
    window.location.href = "login.html"
  })

  user.style.color = "white"

   navbuttons.append(cartbtn,user,logoutbtn)

}


function display(data){
data.map(function(el,index){
    // console.log(el)

    let title = document.createElement("h1")
    title.innerText = el.title;
    let price = document.createElement("h2")
    price.innerText = el.price;
    let image = document.createElement("img")
    image.src = el.image
    let cartbtn = document.createElement("button")
    cartbtn.style.backgroundColor = "red"
    cartbtn.innerText = "Add to Cart"
    cartbtn.addEventListener("click", function(){
        addcart(el)
    })


    let div = document.createElement("div")
    div.append(image,title,price,cartbtn)
    main.append(div)

})
}



function addcart(singledata){
   cartArr.push(singledata)

//    console.log(cartArr)
localStorage.setItem("cartArr" , JSON.stringify(cartArr));
}

</script>

<script src="./data.js"></script>
</html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #main {
        justify-content: center;
        align-items: center;

        color: lime;
        font-size: 3rem;
        font-family: monospace;
      }

      input,
      button {
        height: 40px;
        font-size: 20px;
      }
      #slider {
        width: 400px;
        height: 500px;
        /* border: 2px solid; */
        margin-top: 100px;
      }

      #slider img {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="./store.html">Store Page</a>
      <a href="./slider.html">Slider Page</a>
    </nav>

    <div id="slider"></div>

    <button onclick="playSlider()">Play</button>
    <button onclick="pauseSlider()">Pause</button>
  </body>
  <script>
    let sliderData = JSON.parse(localStorage.getItem("slider_data"));
    let sliderDiv = document.getElementById("slider");
    let index = 0;
    let sliderID;

    function play() {
      sliderDiv.innerHTML = null;
      if (index == sliderData.length) {
        index = 0;
      }

      let img = document.createElement("img");

      img.src = sliderData[index];
      sliderDiv.append(img);
      index++;
    }

    
    function pauseSlider(){
        clearInterval(sliderID)
    }
    
    function playSlider(){
      sliderID =  setInterval(play, 1000);
    }
    
    
   

  </script>
</html>

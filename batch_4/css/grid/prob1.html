<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #grid{
            height: 500px;
            border: 5px solid red;
            display: grid;
            /* repeat(numbers, size)  */
            grid-template-columns: repeat(5,200px);
            grid-template-rows: repeat(2,200px);
            gap: 20px;


        }

        #grid>div{
            font-size: 30px;
            border: 5px solid rgb(95, 47, 255);
        }
    </style>
</head>
<body>
    <div id="grid">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div>10</div>
    </div>
</body>
</html>

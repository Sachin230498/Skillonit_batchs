<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-align: center;
        }
        #main{
            width: 370px;
            /* border: 5px solid; */
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
            margin: auto;
            margin-top: 50px;
            padding: 40px;
        }

        #display{
            width: 100%;
            height: 70px;
            /* border: 2px solid green; */
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
            margin: auto;
            border-radius: 15px;
        }

        #keyboard{
            width: 100%;
            margin: auto;
            margin-top: 20px;
            height: 370px;
            /* border: 2px solid red; */
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 15px;
        }

        #keyboard>div{
            /* border: 2px solid yellowgreen; */
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
            border-radius: 15px;
            font-size: 30px;
            font-weight: bold;
            /* text-align: center; */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bl{
            color: white;
            background-color: black;
        }

        .red{
            color: white;
            background-color: orangered;
        }

    </style>
</head>
<body>
    <h1>Calculator</h1>
    <div id="main">
          <div id="display"></div>
          <div id="keyboard">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div class="bl">+</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div class="bl">-</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div class="bl">*</div>
            <div class="red">C</div>
            <div>0</div>
            <div class="bl" >=</div>
            <div class="bl">/</div>
          </div>
    </div>
</body>
</html>

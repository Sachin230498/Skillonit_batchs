    <input type="number" placeholder="enter 1st number" id="1st">
    <input type="number" placeholder="enter 2nd number" id="2nd"><br>
  
    <br>
    <button onclick="add()">Add</button>
    <button onclick="sub()">Sub</button>
    <button onclick="Divide()">Divide</button>
    <button onclick="Multiply()">Multiply</button>

</body>
<script>
    // console.log("hello")

    let a = document.getElementById("1st");
    let b = document.getElementById("2nd");



    function add(){     
        let x = Number(a.value)+Number(b.value)
         alert(x)
    }
    function sub(){     
        let x = Number(a.value)-Number(b.value)
         alert(x)
    }
    function Divide(){     
        let x = Number(a.value)/Number(b.value)
         alert(x)
    }
    function Multiply(){     
        let x = Number(a.value)*Number(b.value)
         alert(x)
    }
